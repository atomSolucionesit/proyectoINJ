# MySQL local para desarrollo: `docker compose up -d`
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: instituto
      MYSQL_USER: inj
      MYSQL_PASSWORD: inj_local_2026
      MYSQL_ROOT_PASSWORD: inj_root_2026
    ports:
      - "3306:3306"
    volumes:
      - mysql-datos:/var/lib/mysql

volumes:
  mysql-datos:
